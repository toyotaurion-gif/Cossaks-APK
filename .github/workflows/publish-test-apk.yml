name: Publish test APK

on:
  push:
    tags:
      - 'v*-test'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-and-publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Install Android SDK 35
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0"
      - name: Build debug APK
        run: gradle --no-daemon assembleDebug
      - name: Prepare single APK file
        run: |
          mkdir -p dist
          cp app/build/outputs/apk/debug/app-debug.apk dist/Cossacks152-AutoInstaller.apk
      - uses: actions/upload-artifact@v4
        with:
          name: Cossacks152-test-apk
          path: dist/Cossacks152-AutoInstaller.apk
      - name: Publish APK in GitHub Releases (tag only)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          name: Казаки 1.52 для Android — тестовая версия
          prerelease: true
          body_path: RELEASE_NOTES_RU.md
          files: dist/Cossacks152-AutoInstaller.apk
