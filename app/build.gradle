plugins { id 'com.android.application' }

android {
    namespace 'com.cossacks.mobile'
    compileSdk 35

    defaultConfig {
        applicationId 'com.cossacks.mobile'
        minSdk 26
        targetSdk 35
        versionCode 9
        versionName '0.9-installer'
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}
