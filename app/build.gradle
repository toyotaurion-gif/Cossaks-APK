plugins { id 'com.android.application' }

android {
    namespace 'com.cossacks.mobile'
    compileSdk 35

    defaultConfig {
        applicationId 'com.cossacks.mobile'
        minSdk 26
        targetSdk 35
        versionCode 11
        versionName '1.1-ru-auto'
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}
